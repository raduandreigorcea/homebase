const TOAST_ICONS = {
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 11v6M12 7h.01"/></svg>',
};

function toast(msg, kind = 'ok') {
  const t = $('toast');
  t.className = 'toast ' + kind;
  t.innerHTML = `<span class="ti">${TOAST_ICONS[kind]}</span><span>${esc(msg)}</span>`;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), kind === 'err' ? 5000 : 3000);
}

// "Prepare PC": one command, pasted once on a Windows PC, sets up stats and Remote Desktop.
async function showAgentSetup(id) {
  let j;
  try { j = await (await fetch(`/api/agent/${encodeURIComponent(id)}`, { method: 'POST' })).json(); } catch {}
  if (!j?.ok) return toast('Couldn\'t make the command', 'err');
  const back = document.createElement('div');
  back.className = 'dlg-back';
  back.innerHTML = `
    <div class="dlg" role="dialog" aria-modal="true" style="width:min(520px,100%)">
      <div class="di info">${ICONS.connect}</div>
      <h3>Prepare this PC</h3>
      <p>Once per Windows PC. After that you see it live here and connect to it in one click.</p>
      <ol>
        <li>On the PC, press <b>Win + X</b> and pick <b>Terminal (Admin)</b> (or <b>Windows PowerShell (Admin)</b>), then <b>Yes</b>.</li>
        <li>Paste the command below and press <b>Enter</b>. It shows its progress and takes 1–2 minutes.</li>
      </ol>
      <div class="cmd"><code>${esc(j.command)}</code><button data-r="copy" title="Copy">Copy</button></div>
      <p style="margin-top:12px;font-size:12px">The command works for 15 minutes. It turns on stats, Remote Desktop and SSH; when you connect, you sign in on the usual Windows screen with your PIN or password.</p>
      <div class="row-btns"><button data-r="no" class="primary">Done</button></div>
    </div>`;
  document.body.appendChild(back);
  requestAnimationFrame(() => back.classList.add('show'));
  const close = () => { back.classList.remove('show'); setTimeout(() => back.remove(), 150); document.removeEventListener('keydown', onKey, true); };
  const onKey = e => { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); close(); } };
  document.addEventListener('keydown', onKey, true);
  back.addEventListener('click', async e => {
    const r = e.target.closest('[data-r]')?.dataset.r;
    if (e.target === back || r === 'no') return close();
    if (r === 'copy') {
      try { await navigator.clipboard.writeText(j.command); }
      catch {
        const range = document.createRange(); range.selectNodeContents(back.querySelector('code'));
        getSelection().removeAllRanges(); getSelection().addRange(range); document.execCommand('copy');
      }
      toast('Command copied', 'ok');
    }
  });
}

// In-app replacement for confirm()/prompt(). Resolves to true / the typed text, or null if cancelled.
const USER_OK = v => !v || /^[A-Za-z_][A-Za-z0-9_.-]{0,31}$/.test(v) ? '' : 'A user name can only have letters, digits and - _ .';

async function saveDevice(id, changes) {
  try {
    const j = await (await fetch(`/api/edit/${encodeURIComponent(id)}`, { method: 'POST', body: JSON.stringify(changes) })).json();
    if (!j.ok) { toast(j.error || 'Couldn\'t save', 'err'); return false; }
  } catch { toast('Error: the server isn\'t responding', 'err'); return false; }
  await poll();
  return true;
}

// One place to change what's specific to each person's device: name, user and password.
async function editDevice(d) {
  if (!d) return;
  const fields = [{ key: 'name', label: 'Name', value: d.name, validate: v => v ? '' : 'Type a name' }];
  if (d.kind !== 'tv') {
    fields.push({ key: 'ssh_user', label: d.windows ? 'Windows user' : 'SSH user', value: d.ssh_user || '',
                  placeholder: d.windows ? 'what whoami shows after \\' : 'e.g. pi, admin, ubuntu',
                  hint: d.windows
                    ? 'For Remote Desktop and SSH. If Windows asks for something else when signing in (like your Microsoft account email), type it there and it\'s remembered.'
                    : 'The one picked when the system was installed (in Raspberry Pi Imager: "username").',
                  validate: v => v ? USER_OK(v) : '' });
  }
  if (d.kind !== 'tv') {
    fields.push({ key: 'ssh_password', label: 'SSH password', secret: true,
                  placeholder: d.key ? 'already set up' : 'the device\'s password',
                  hint: d.key ? 'Password-free access works. Type the password only to set it up again; "Remove key" turns it off.'
                    : d.windows ? 'Only if SSH is on the PC: once, for direct file sending, speed tests and restarts. It isn\'t saved. Remote Desktop asks for its own password.'
                    : 'Used once, to set up password-free access. It isn\'t saved anywhere.' });
  }
  const v = await dialog({ title: 'Device settings', icon: d.kind in ICONS ? d.kind : 'other', ok: 'Save', fields,
                          extra: d.key ? { key: 'keyremove', label: 'Remove key' } : null });
  if (!v) return;
  if (v._extra === 'keyremove') return removeKey(d);
  const password = v.ssh_password;
  delete v.ssh_password;
  if (!await saveDevice(d.id, v)) return;
  if (!password) return toast('Saved', 'ok');
  if (!v.ssh_user) return toast('Saved. For password-free access, fill in the SSH user too.', 'err');
  toastProgress(`Setting up password-free access on ${v.name || d.name}…`);
  let j;
  try {
    j = await (await fetch(`/api/keysetup/${encodeURIComponent(d.id)}`, { method: 'POST', body: JSON.stringify({ password }) })).json();
  } catch {}
  if (j?.ok) toast(`Done! ${v.name || d.name} now works without a password`, 'ok');
  else toast(j?.error || 'Error: the server isn\'t responding', 'err');
  poll();
}

async function removeKey(d) {
  const go = await dialog({
    title: `Remove password-free access from ${d.name}?`, icon: 'x', danger: true, ok: 'Remove',
    text: 'Homebase deletes its key from the device. Stats, files and the speed test stop working ' +
          'until you type the password in settings again. The terminal still works, with a password.',
  });
  if (!go) return;
  toastProgress(`Removing the key from ${d.name}…`);
  let j;
  try { j = await (await fetch(`/api/keyremove/${encodeURIComponent(d.id)}`, { method: 'POST' })).json(); } catch {}
  if (j?.ok) toast(`Password-free access removed from ${d.name}`, 'ok');
  else toast(j?.error || 'Error: the server isn\'t responding', 'err');
  poll();
}

// `input` asks for one value (resolves to the string); `fields` asks for several (resolves to {key: value}).
// `extra` adds a left-hand button: {key, label}; choosing it resolves to {_extra: key}.
function dialog({ title, text = '', icon = 'info', ok = 'OK', danger = false, input = null, fields = null, extra = null }) {
  const list = fields || (input ? [{ key: '_', ...input }] : []);
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'dlg-back';
    back.innerHTML = `
      <div class="dlg" role="dialog" aria-modal="true">
        <div class="di ${danger ? 'danger' : 'info'}">${ICONS[icon] || ICONS.other}</div>
        <h3>${esc(title)}</h3>
        ${text ? `<p>${esc(text)}</p>` : ''}
        ${list.map(f => `
          <label class="dlg-field">${f.label ? `<span>${esc(f.label)}</span>` : ''}
            <input type="${f.secret ? 'password' : 'text'}" data-key="${esc(f.key)}" inputmode="${f.numeric ? 'numeric' : 'text'}" autocomplete="${f.secret ? 'new-password' : 'off'}" spellcheck="false"
                   placeholder="${esc(f.placeholder || '')}" value="${esc(f.value || '')}">
            ${f.hint ? `<small>${esc(f.hint)}</small>` : ''}
          </label>`).join('')}
        ${list.length ? '<div class="err-msg"></div>' : ''}
        <div class="row-btns">
          ${extra ? `<button data-r="extra" class="dlg-extra">${esc(extra.label)}</button>` : ''}
          <button data-r="no">Cancel</button>
          <button data-r="yes" class="${danger ? 'danger' : 'primary'}">${esc(ok)}</button>
        </div>
      </div>`;
    document.body.appendChild(back);
    requestAnimationFrame(() => back.classList.add('show'));
    const inputs = [...back.querySelectorAll('input[data-key]')];
    (inputs[0] || back.querySelector('[data-r=yes]')).focus();

    const done = val => {
      document.removeEventListener('keydown', onKey, true);
      back.classList.remove('show');
      setTimeout(() => back.remove(), 150);
      resolve(val);
    };
    const accept = () => {
      if (!list.length) return done(true);
      const out = {};
      for (const [i, f] of list.entries()) {
        const v = f.secret ? inputs[i].value : inputs[i].value.trim();  // a password may start or end with a space
        const bad = f.validate?.(v);
        if (bad) { back.querySelector('.err-msg').textContent = bad; inputs[i].focus(); return; }
        out[f.key] = v;
      }
      done(fields ? out : out._);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
      else if (e.key === 'Enter') { e.preventDefault(); accept(); }
    };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('click', e => {
      if (e.target === back) return done(null);
      const r = e.target.closest('[data-r]')?.dataset.r;
      if (r === 'no') done(null);
      else if (r === 'extra') done({ _extra: extra.key });
      else if (r === 'yes') accept();
    });
  });
}


async function tvSend(id, op, value) {
  try {
    const r = await fetch(`/api/tv/${encodeURIComponent(id)}`, { method: 'POST', body: JSON.stringify({ op, value }) });
    const j = await r.json();
    if (!j.ok) toast(op === 'volume' || op === 'mute'
      ? 'The TV didn\'t change the volume. It only accepts it while playing over DLNA.'
      : 'The TV didn\'t respond', 'err');
  } catch { toast('Error: the server isn\'t responding', 'err'); }
  poll();
}

// TV buttons (captured before the generic button handlers), on the cards and in the TV's big screen.
function onTvButton(e) {
  const b = e.target.closest('button[data-tv]');
  if (!b || b.disabled) return;
  e.stopImmediatePropagation();
  const id = b.closest('[data-id]').dataset.id, tv = last?.tv?.[id];
  const op = b.dataset.tv;
  const value = op === 'seek' ? Math.max(0, (tv?.pos || 0) + Number(b.dataset.v)) : op === 'mute' ? !tv?.mute : undefined;
  busy(b, () => tvSend(id, op, value), 300);
}

$('devices').addEventListener('pointerdown', () => { pointerHeld = true; });

$('devices').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  // Anywhere else on a card (not a button or the TV controls) opens its big screen.
  if (!btn && !e.target.closest('button, input, a')) {
    const card = e.target.closest('.device');
    if (card) openDetail(card.dataset.id);
    return;
  }
  if (!btn || btn.disabled) return;
  const card = btn.closest('[data-id]');
  const id = card.dataset.id, act = btn.dataset.act;
  if (act === 'terminal') return openTerminal(last.devices.find(d => d.id === id));
  if (act === 'agent') return showAgentSetup(id);
  if (act === 'tvconnect') return toast('Connecting to the TV is coming soon', 'info');
  if (act === 'edit') return editDevice(last.devices.find(d => d.id === id));
  if (act === 'remove' && !await dialog({
    title: `Remove "${card.querySelector('.dev-name').textContent}"?`,
    text: 'It disappears from the panel. Add it again later and its settings come back.',
    icon: 'x', ok: 'Remove', danger: true,
  })) return;
  if (act === 'connect') toast('Opening Remote Desktop… this can take a few seconds', 'info');
  // Remmina takes a few seconds to show its window, so keep the spinner up meanwhile.
  await busy(btn, async () => {
    try {
      const r = await fetch(`/api/${act}/${encodeURIComponent(id)}`, { method: 'POST' });
      const j = await r.json();
      const [msg, kind] = {
        wake: ['Wake-up signal sent. It can take a minute.', 'info'],
        connect: j.ok ? [null] : [j.error || 'Couldn\'t open Remote Desktop', 'err'],
        remove: ['Removed from the panel', 'ok'],
      }[act];
      if (msg) toast(msg, kind);
      if (act === 'remove') await poll();
    } catch { toast('Error: the server isn\'t responding', 'err'); }
  }, act === 'connect' ? 4000 : 600);
});

function redrawDiscovered() {
  const disc = $('discovered');
  if (!last) return;
  const html = discoveredCard(last.discovered || [], last.last_scan, last.now);
  disc.innerHTML = html; disc.dataset.html = html;
}

// Enter adds, Escape closes the open "add" form.
$('discovered').addEventListener('keydown', e => {
  if (!e.target.matches('.disc.open input')) return;
  if (e.key === 'Enter') { e.preventDefault(); e.target.closest('.disc').querySelector('[data-act=add]').click(); }
  if (e.key === 'Escape') { discOpen = null; redrawDiscovered(); }
});

$('discovered').addEventListener('click', async e => {
  const chip = e.target.closest('button[data-kind]');
  if (chip) {
    chosenKind[chip.closest('.disc').dataset.mac] = chip.dataset.kind;
    chip.parentElement.querySelectorAll('.kind').forEach(b => b.classList.toggle('sel', b === chip));
    return;
  }
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.act;
  if (act === 'open' || act === 'cancel' || act === 'unknown') {
    if (act === 'unknown') discShowUnknown = !discShowUnknown;
    else discOpen = act === 'open' ? btn.closest('.disc').dataset.mac : null;
    redrawDiscovered();
    if (act === 'open') {
      const input = $('discovered').querySelector('.disc.open input');
      input?.focus(); input?.select();
    }
    return;
  }
  if (btn.dataset.act === 'scan') {
    // A sweep takes ~4 s; keep the refresh icon spinning until the new results are in.
    return busy(btn, async () => {
      try { await fetch('/api/scan', { method: 'POST' }); } catch { return toast('Error: the server isn\'t responding', 'err'); }
      await new Promise(r => setTimeout(r, 4500));
      await poll();
    });
  }
  if (btn.dataset.act === 'add') {
    const row = btn.closest('.disc');
    const name = row.querySelector('input').value.trim();
    if (!name) { toast('Type a name', 'err'); return row.querySelector('input').focus(); }
    // Adding a TV looks it up on the network first, so this can take a few seconds.
    await busy(btn, async () => {
      try {
        const r = await fetch('/api/add', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip: row.dataset.ip, mac: row.dataset.mac, name, kind: row.querySelector('.kind.sel')?.dataset.kind || 'other' }),
        });
        const j = await r.json();
        toast(j.ok ? `"${name}" added` : 'Couldn\'t add it', j.ok ? 'ok' : 'err');
        if (j.ok) discOpen = null;
        document.activeElement.blur();
        await poll();
      } catch { toast('Error: the server isn\'t responding', 'err'); }
    });
  }
});

// --- Actions run from the / palette ------------------------------------------

// [action, label, command] per device; the command is what you type in the palette.
function deviceActions(d) {
  const out = [];
  if (d.kind === 'tv') return out;  // TVs are driven over DLNA, never SSH
  if (d.ssh) out.push(['terminal', 'Open terminal', 'ssh']);
  if (d.windows && d.nla == null) out.push(['prepare', 'Prepare PC', 'prepare']);
  else if (d.windows && d.nla !== -1) out.push(['connect', 'Remote Desktop', 'rdp']);
  // Prepared before SSH was part of it (or SSH failed): running the command again adds it.
  if (d.windows && d.nla != null && !d.key) out.push(['prepare', 'Prepare again (adds SSH)', 'prepare']);
  if (d.has_wake) out.push(['wake', 'Wake it up', 'wake']);
  if (d.ssh && !d.key) out.push(['key', 'Password-free access…', 'key']);
  // Without SSH, a Windows PC still gets files: they go to the laptop folder Remote Desktop shares with it.
  if (!d.key && d.windows) out.push(['send', 'Send files…', 'send']);
  if (d.key) {
    out.push(['send', 'Send files…', 'send'], ['speed', 'Speed test', 'speed']);
    if (!d.windows) out.push(['update', 'Update the system', 'update']);
    out.push(['reboot', 'Restart', 'reboot'], ['poweroff', 'Shut down', 'poweroff']);
  }
  return out;
}

async function doAction(act, d) {
  if (!d) return;
  const name = d.name;
  if (act === 'terminal') return openTerminal(d);
  if (act === 'edit') return editDevice(d);
  if (act === 'prepare') return showAgentSetup(d.id);
  if (act === 'key') return editDevice(d);  // the password goes in the device's settings
  if (act === 'update') return openTerminal(d, 'update');
  if (act === 'reboot' || act === 'poweroff') {
    const reboot = act === 'reboot';
    const go = await dialog({
      title: `${reboot ? 'Restart' : 'Shut down'} ${name}?`, icon: 'power', danger: !reboot, ok: reboot ? 'Restart' : 'Shut down',
      text: reboot ? 'It\'s back on the network in 1–2 minutes.' : 'To turn it back on, someone has to press its power button (or unplug it and plug it back in).',
    });
    if (go) openTerminal(d, act);
    return;
  }
  if (act === 'speed') return speedTest(d);
  if (act === 'send') { sendTarget = d; $('send-file').value = ''; return $('send-file').click(); }
  if (act === 'connect' || act === 'wake') {
    if (act === 'connect') toast('Opening Remote Desktop… this can take a few seconds', 'info');
    try {
      const j = await (await fetch(`/api/${act}/${encodeURIComponent(d.id)}`, { method: 'POST' })).json();
      if (act === 'wake') toast('Wake-up signal sent. It can take a minute.', 'info');
      else if (!j.ok) toast(j.error || 'Couldn\'t open Remote Desktop', 'err');
    } catch { toast('Error: the server isn\'t responding', 'err'); }
  }
}

// Last speed test per device, shown in its big screen (not on the card: it's not live).
const speeds = {};

async function speedTest(d) {
  if (speeds[d.id]?.running) return;
  speeds[d.id] = { running: true };
  if (detailId !== d.id) toast(`Measuring the speed to ${d.name}… (~8 seconds)`, 'info');
  renderDetail();
  let j;
  try { j = await (await fetch(`/api/speed/${encodeURIComponent(d.id)}`, { method: 'POST' })).json(); } catch {}
  const fmt = v => v == null ? '–' : v >= 100 ? String(Math.round(v)) : v.toFixed(1).replace('.', ',');
  speeds[d.id] = j?.ok ? { down: fmt(j.down), up: fmt(j.up), t: Date.now() } : { failed: true, t: Date.now() };
  if (detailId !== d.id) toast(j?.ok ? `${d.name}: ↓ ${fmt(j.down)} · ↑ ${fmt(j.up)} Mbit/s` : `Couldn't measure the speed to ${d.name}`, j?.ok ? 'ok' : 'err');
  renderDetail();
}

// --- Sending files: "send <device>" in the palette, or drop files on a card ---

let sendTarget = null;
$('send-file').addEventListener('change', () => {
  if (sendTarget && $('send-file').files.length) sendFiles(sendTarget, [...$('send-file').files]);
});

// A toast that stays up and updates (upload progress), until a normal toast replaces it.
function toastProgress(msg) {
  const t = $('toast');
  t.className = 'toast info show';
  t.innerHTML = `<span class="ti"><span class="spin" style="width:14px;height:14px"></span></span><span>${esc(msg)}</span>`;
  clearTimeout(t._h);
}

function uploadOne(d, file, label) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('POST', `/api/send/${encodeURIComponent(d.id)}?name=${encodeURIComponent(file.name)}`);
    x.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round(100 * e.loaded / e.total);
      toastProgress(pct < 100 ? `${label}: ${pct}%` : `${label}: copying to ${d.name}…`);
    };
    // Resolves to the server's answer: {ok, via: "ssh" | "shared", folder}.
    x.onload = () => { try { resolve(JSON.parse(x.responseText)); } catch { resolve({}); } };
    x.onerror = () => resolve({});
    x.send(file);
  });
}

async function sendFiles(d, files) {
  if (!d.key && !d.windows) return toast(`First type the SSH password in ${d.name}'s settings (✎)`, 'err');
  let ok = 0, res = {};
  for (const [i, f] of files.entries()) {
    const label = files.length > 1 ? `${f.name} (${i + 1}/${files.length})` : f.name;
    toastProgress(`${label}: 0%`);
    const r = await uploadOne(d, f, label);
    if (r.ok) { ok++; res = r; }
  }
  const what = ok > 1 ? `${ok} files` : files[0].name;
  if (ok < files.length) toast(`Sent ${ok} of ${files.length}. Check that ${d.name} is on.`, 'err');
  // Without SSH they wait in the laptop folder that Remote Desktop shows on the PC.
  else if (res.via === 'shared') toast(`${what}: on the PC, in Remote Desktop › This PC › the shared folder (${res.folder.split('/').pop()})`, 'ok');
  else toast(`${what}${ok > 1 ? ' are' : ' is'} on ${d.name}, in ${d.windows ? 'Downloads' : `${d.ssh_user || 'the user'}'s home folder`}`, 'ok');
}

// The browser would otherwise open a file dropped anywhere on the page.
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => e.preventDefault());
$('devices').addEventListener('dragover', e => {
  const card = e.target.closest('.device');
  if (!card || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  if (!card.classList.contains('drop')) {
    document.querySelectorAll('.device.drop').forEach(c => c.classList.remove('drop'));
    card.classList.add('drop');
  }
});
$('devices').addEventListener('dragleave', e => {
  const card = e.target.closest('.device');
  if (card && !card.contains(e.relatedTarget)) card.classList.remove('drop');
});
$('devices').addEventListener('drop', e => {
  const card = e.target.closest('.device');
  document.querySelectorAll('.device.drop').forEach(c => c.classList.remove('drop'));
  if (!card || !e.dataTransfer.files.length) return;
  e.preventDefault();

});

// --- Command palette: press / (or Ctrl+K) -----------------------------------

const norm = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
let palItems = [], palSel = 0;

function paletteCommands() {
  const out = [{ text: 'scan', desc: 'Look for new devices', run: () => fetch('/api/scan', { method: 'POST' }).then(() => toast('Searching the network…', 'info')) }];
  for (const d of last?.devices || []) {
    for (const [act, label, cmd] of deviceActions(d)) out.push({ text: `${cmd} ${d.name}`, desc: label.replace('…', ''), run: () => doAction(act, d) });
    out.push({ text: `edit ${d.name}`, desc: 'Settings', run: () => doAction('edit', d) });
  }
  return out;
}

function renderPalette() {
  const q = norm($('pal-input').value.trim());
  const words = q.split(/\s+/).filter(Boolean);
  const all = paletteCommands();
  if (!q) {
    // Nothing typed yet: each command once, without device names. Picking one types it in
    // and then lists the devices it works on; a command without a device (scan) just runs.
    const verbs = new Map();
    for (const c of all) {
      const verb = c.text.split(' ')[0];
      if (!verbs.has(verb)) verbs.set(verb, c.text === verb ? c : { text: verb, desc: c.desc, fill: verb + ' ' });
    }
    palItems = [...verbs.values()];
  } else {
    palItems = all.filter(c => words.every(w => norm(c.text).includes(w)))
                  .sort((a, b) => norm(b.text).startsWith(q) - norm(a.text).startsWith(q))
                  .slice(0, 12);
  }
  palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  $('pal-list').innerHTML = palItems.length
    ? palItems.map((c, i) => `<div class="pal-item ${i === palSel ? 'sel' : ''}" role="option" aria-selected="${i === palSel}" data-i="${i}"><b>${esc(c.text)}</b><span>${esc(c.desc)}</span></div>`).join('')
    : '<div class="pal-empty">No command. Try: ssh, wake, send, speed, scan</div>';
}

function openPalette() {
  if (!last) return;
  $('pal').hidden = false;
  $('pal-input').value = '';
  palSel = 0;
  renderPalette();
  $('pal-input').focus();
}
function closePalette() { $('pal').hidden = true; }
function runPalette(i) {
  const c = palItems[i];
  if (!c) return;
  if (c.fill) return fillPalette(c.fill);
  closePalette();
  c.run();
}
function fillPalette(text) {
  $('pal-input').value = text;
  palSel = 0;
  renderPalette();
  $('pal-input').focus();
}

$('pal-input').addEventListener('input', () => { palSel = 0; renderPalette(); });
$('pal-input').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); palSel = (palSel + 1) % Math.max(1, palItems.length); renderPalette(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel - 1 + palItems.length) % Math.max(1, palItems.length); renderPalette(); }
  else if (e.key === 'Tab') { e.preventDefault(); const c = palItems[palSel]; if (c) fillPalette(c.fill || c.text); }
  else if (e.key === 'Enter') { e.preventDefault(); runPalette(palSel); }
  else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
});
$('pal-list').addEventListener('click', e => { const it = e.target.closest('.pal-item'); if (it) runPalette(+it.dataset.i); });
$('pal').addEventListener('click', e => { if (e.target === $('pal')) closePalette(); });

document.addEventListener('keydown', e => {
  // Not while typing somewhere, nor while the terminal or a dialog is open (they need those keys).
  if (!$('term-modal').hidden || document.querySelector('.dlg-back') || !$('pal').hidden) return;
  const typing = e.target.closest?.('input, textarea, [contenteditable]');
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
    e.preventDefault();
    openPalette();
  }
});

// --- A device's big screen (click a card) -----------------------------------
// Left: live numbers and charts, redrawn every poll (nothing to click there).
// Right: commands, redrawn only when they change, so focus and hover stay put.

let detailId = null;

function openDetail(id) {
  if (!last?.devices.some(d => d.id === id)) return;
  detailId = id;
  $('dev-modal').hidden = false;
  // Forget what was drawn for the previous device; '' would match a device with nothing to show there.
  for (const el of ['dv-icon', 'dv-who', 'dv-main', 'dv-side']) { delete $(el).dataset.html; $(el).innerHTML = ''; }
  renderDetail();
  $('dv-close').focus();
}
function closeDetail() {
  detailId = null;
  $('dev-modal').hidden = true;
}

const ago = t => {
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`;
};
const evTime = t => {
  const d = new Date(t * 1000), today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
};

// A small filled line for a tile: [values], colour, top of the scale.
function miniSpark(data, col, top) {
  const v = (data || []).filter(x => x != null);
  if (v.length < 2) return '<svg aria-hidden="true"></svg>';
  const w = 200, h = 26, step = w / (v.length - 1);
  const d = v.map((x, i) => (i ? 'L' : 'M') + (i * step).toFixed(1) + ' ' + (h - 2 - Math.min(x, top) / top * (h - 4)).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${col}" opacity=".12"/>` +
         `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

// Response time with a readable scale: sized to the usual values, rare spikes clipped and marked.
function bigLatChart(svg, data) {
  const w = svg.clientWidth || 600, h = svg.clientHeight || 150, N = 90;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const vals = data.filter(v => v != null).sort((a, b) => a - b);
  const p90 = vals.length ? vals[Math.floor(vals.length * .9)] : 1;
  const top = [25, 50, 100, 200, 500, 1000, 2000, 5000].find(x => x >= p90 * 1.4) || 5000;
  const step = w / (N - 1), off = w - (data.length - 1) * step, pad = 3;
  const y = v => h - pad - Math.min(v, top) / top * (h - 2 * pad);
  let out = '';
  for (const f of [0, .5, 1]) {
    const gy = pad + (1 - f) * (h - 2 * pad);
    // Labels on the left: the newest data is on the right, where they'd cover it.
    out += `<line x1="0" x2="${w}" y1="${gy}" y2="${gy}" stroke="#1b2430"/><text x="2" y="${gy - 4}" fill="var(--dim)" font-size="10">${Math.round(top * f)} ms</text>`;
  }
  const first = data.findIndex(v => v != null);
  const startX = first < 0 ? w : off + first * step;
  if (startX > 4) out += `<line x1="0" x2="${startX.toFixed(1)}" y1="${h - pad}" y2="${h - pad}" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="2 5"/>`;
  let path = '', pen = false;
  data.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    path += (pen ? 'L' : 'M') + (off + i * step).toFixed(1) + ' ' + y(v).toFixed(1);
    pen = true;
    if (v > top) out += `<text x="${(off + i * step).toFixed(1)}" y="10" text-anchor="middle" fill="var(--amber)" font-size="10">↑${Math.round(v)}</text>`;
  });
  if (path) out += `<path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>`;
  svg.innerHTML = out;
}

function detailMain(d, st, s) {
  const online = st?.online, checked = st != null && st.online != null;
  // Stats come over SSH from Linux devices, or from the agent on Windows PCs.
  const ssh = online ? (s.sshstats?.[d.id] || s.stats?.[d.id]) : null, h = s.history || {};
  const lat = (h['lat:' + d.id] || []).filter(v => v != null);
  const tile = (label, value, unit, spark = '') =>
    `<div class="dv-tile"><span>${label}</span><b>${value}${value === '–' ? '' : `<small>${unit}</small>`}</b>${spark}</div>`;
  const tiles = [];
  if (d.probe_port) {
    // Scale to the usual values, like the big chart, so one slow reply doesn't flatten the line.
    const recent = lat.slice(-30), sorted = [...recent].sort((a, b) => a - b);
    const top = Math.max(25, (sorted[Math.floor(sorted.length * .9)] || 0) * 1.4);
    tiles.push(tile('Response', online && st.latency != null ? Math.round(st.latency) : '–', 'ms', miniSpark(recent, 'var(--blue)', top)));
  }
  if (ssh) {
    tiles.push(tile('CPU', ssh.cpu == null ? '…' : Math.round(ssh.cpu), '%', miniSpark(h['cpu:' + d.id], color(ssh.cpu ?? 0), 100)));
    if (ssh.temp != null) tiles.push(tile('Temp', Math.round(ssh.temp), '°', miniSpark((h['temp:' + d.id] || []).map(v => v - 25), color(ssh.temp, 65, 80), 60)));
    if (ssh.gpu != null) tiles.push(tile('GPU', Math.round(ssh.gpu), '%', miniSpark(h['gpu:' + d.id], color(ssh.gpu), 100)));
    const ram = 100 * (1 - ssh.mem_free / ssh.mem_total);
    tiles.push(tile('RAM', Math.round(ram), '%', miniSpark(h['ram:' + d.id], color(ram, 75, 90), 100)));
  }
  const latInfo = lat.length ? `min ${Math.round(Math.min(...lat))} · avg ${Math.round(lat.reduce((a, b) => a + b, 0) / lat.length)} · last 3 min` : 'last 3 min';
  const latSec = d.probe_port ? `<div class="dv-sec"><h4>Response time <span>${latInfo}</span></h4>
      <div class="dv-chart"><svg id="dv-lat" preserveAspectRatio="none" aria-label="Response time, last 3 minutes"></svg></div></div>` : '';
  let sys = '';
  if (ssh) {
    const diskUsed = ssh.disk_total - ssh.disk_free, memUsed = ssh.mem_total - ssh.mem_free;
    const kv = (label, val, pct, warn, crit) => `<div class="dv-kv"><span>${label}</span><b>${val}</b>${pct == null ? '' :
      `<div class="bar"><i style="width:${Math.min(100, pct)}%;background:${color(pct, warn, crit)}"></i></div>`}</div>`;
    const agent = !s.sshstats?.[d.id];
    sys = `<div class="dv-sec"><h4>System <span>${agent ? 'sent by the PC every 5 s' : 'read over SSH every 30 s'}</span></h4><div class="dv-sys">
      ${ssh.disk_total ? kv(d.windows ? 'Disk C:' : 'Disk', `${bytes(ssh.disk_free)} free of ${bytes(ssh.disk_total)}`, 100 * diskUsed / ssh.disk_total, 85, 95) : ''}
      ${kv('Memory', `${bytes(memUsed)} of ${bytes(ssh.mem_total)}`, 100 * memUsed / ssh.mem_total, 75, 90)}
      ${ssh.boot ? kv('System up for', dur(s.now - ssh.boot)) : ''}
      ${ssh.kernel ? kv('Kernel', esc(ssh.kernel)) : ''}
      ${agent && ssh.os ? kv('System', esc(ssh.os.replace(/^Microsoft /, ''))) : ''}
      ${agent && ssh.top_name ? kv('Busiest app', `${esc(ssh.top_name)} · ${Math.round(ssh.top_cpu || 0)}%`) : ''}
      ${agent && ssh.net_down != null ? kv('Network', `↓ ${bytes(ssh.net_down, true)} · ↑ ${bytes(ssh.net_up, true)}`) : ''}
    </div></div>`;
  }
  const strip = t => t.startsWith(d.name + ': ') ? t.slice(d.name.length + 2) : t.startsWith(d.name + ' ') ? t.slice(d.name.length + 1) : t;
  const log = d.recent?.length ? `<div class="dv-sec"><h4>What happened <span>this device only</span></h4><div class="dv-log">
      ${d.recent.map(e => `<div class="${esc(e.kind)}"><time>${evTime(e.t)}</time><i></i><span>${esc(strip(e.text))}</span></div>`).join('')}
    </div></div>` : '';
  const state = !checked ? '<p class="dv-note">Checking…</p>' : !online ? '<p class="dv-note">The device is off or not on the network.</p>' : '';
  return `<div class="dv-tiles">${tiles.join('')}</div>${state}${latSec}${sys}${log}`;
}

function detailSide(d, st, s = last) {
  const online = st?.online;
  if (d.dlna) {
    // A TV: its playback and volume controls (same as on its card), wrapped so the handlers find the device.
    const tv = s?.tv?.[d.id];
    return `<div class="dv-sec"><h4>Playback</h4>${tv && online ? `<div data-id="${esc(d.id)}">${tvBlock(d, tv)}</div>`
      : `<p class="dv-note">${online ? 'The TV isn\'t answering commands yet (DLNA).' : 'The TV is off.'}</p>`}</div>`;
  }
  const short = d.name;
  // Waking only makes sense when it's off (same as on the card).
  const acts = deviceActions(d).filter(([a]) => !['send', 'speed'].includes(a) && !(a === 'wake' && online));
  const cmds = acts.length ? `<div class="dv-sec"><h4>Commands</h4><div class="dv-cmds">
      ${acts.map(([a, label, cmd]) => `<button class="dv-cmd ${a === 'poweroff' ? 'danger-item' : ''}" data-dv="${a}" ${online || ['wake', 'key'].includes(a) ? '' : 'disabled'}>
        <span class="p">$</span><code>${cmd} <em>${esc(short)}</em></code><span>${label.replace('…', '').toLowerCase()}</span></button>`).join('')}
    </div></div>` : '';
  const files = d.key || d.windows ? `<div class="dv-sec"><h4>Files</h4>
      <div class="dv-drop" data-dv="send" role="button" tabindex="0">
        <b>Drop files here</b>
        <small>${d.key ? `or click · they land in ${d.windows ? 'Downloads' : `${esc(d.ssh_user || '')}'s home folder`}`
                       : 'or click · find them on the PC in Remote Desktop › This PC › the folder shared by the laptop'}</small>
      </div></div>` : '';
  const sp = speeds[d.id];
  const speed = d.key ? `<div class="dv-sec"><h4>Speed to it <span>${sp?.t && !sp.running ? ago(sp.t) : ''}</span></h4><div class="dv-speed">
      ${sp?.running ? '<p class="dv-note"><span class="spin" style="width:12px;height:12px;display:inline-block;vertical-align:-2px"></span> Measuring… ~8 s</p>'
        : sp?.failed ? '<p class="dv-note">Couldn\'t measure it.</p>'
        : sp ? `<div class="nums"><div><b>${sp.down}</b><span>↓ download Mbit/s</span></div><div><b>${sp.up}</b><span>↑ upload Mbit/s</span></div></div>`
        : '<p class="dv-note">How fast data moves between this laptop and it, over Wi-Fi.</p>'}
      <button data-dv="speed" ${online && !sp?.running ? '' : 'disabled'}>${sp && !sp.running ? 'Measure again' : 'Measure'}</button>
    </div></div>` : '';
  const hint = d.ssh && !d.key ? '<p class="dv-note">Type the SSH password in ✎ to get stats, files and a speed test here.</p>'
    : !d.ssh && d.kind !== 'tv' && !d.windows ? '<p class="dv-note">Set an SSH user and password in ✎ to control it from here.</p>' : '';
  return cmds + files + speed + hint;
}

function renderDetail(s = last) {
  if (!detailId || !s) return;
  const d = s.devices.find(x => x.id === detailId);
  if (!d) return closeDetail();
  const st = s.status[d.id], online = st?.online, checked = st != null && st.online != null;
  const ssh = online ? (s.sshstats?.[d.id] || s.stats?.[d.id]) : null;
  const put = (id, html, guard = false) => {
    const el = $(id);
    if (el.dataset.html !== html && !guard) { el.innerHTML = html; el.dataset.html = html; }
  };
  put('dv-icon', ICONS[d.kind] || ICONS.other);
  const sub = [d.os ? `<span class="os-tag">${esc(d.os.replace(' (DLNA)', ''))}</span>` : '', ssh?.model ? esc(ssh.model.replace(/ Rev [\d.]+$/, '')) : '',
               esc(d.host), d.ssh_user && d.kind !== 'tv' ? `${esc(d.ssh_user)}@` : ''].filter(Boolean).join(' · ');
  put('dv-who', `<h3><span id="dv-name">${esc(d.name)}</span><span class="pill ${!checked ? '' : online ? 'on' : 'off'}"><span class="dot"></span>${
      !checked ? 'Checking…' : online ? `On${st.since ? ` <small>· for ${dur(s.now - st.since)}</small>` : ''}` : 'Off'}</span></h3><p>${sub}</p>`);
  put('dv-main', detailMain(d, st, s));
  put('dv-side', detailSide(d, st, s), $('dv-side').querySelector('.busy, .drop') || pointerHeld);
  if ($('dv-lat')) bigLatChart($('dv-lat'), (s.history || {})['lat:' + d.id] || []);
}

// Same icons as on the cards.
$('dv-edit').innerHTML = ICONS.edit;
$('dv-close').innerHTML = ICONS.x;
$('dv-close').addEventListener('click', closeDetail);
$('dv-edit').addEventListener('click', () => editDevice(last.devices.find(d => d.id === detailId)));
$('dev-modal').addEventListener('click', e => { if (e.target === $('dev-modal')) closeDetail(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && detailId && $('term-modal').hidden && !document.querySelector('.dlg-back') && $('pal').hidden) closeDetail();
});
addEventListener('resize', () => { if (detailId && $('dv-lat')) bigLatChart($('dv-lat'), (last.history || {})['lat:' + detailId] || []); });
$('dv-side').addEventListener('pointerdown', () => { pointerHeld = true; });
$('dv-side').addEventListener('click', e => {
  const el = e.target.closest('[data-dv]');
  if (!el || el.disabled) return;
  doAction(el.dataset.dv, last.devices.find(x => x.id === detailId));  // the terminal and dialogs open on top
});
$('dv-side').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('dv-drop')) { e.preventDefault(); e.target.click(); }
});
$('dv-side').addEventListener('dragover', e => {
  const zone = e.target.closest('.dv-drop');
  if (!zone || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  zone.classList.add('drop');
});
$('dv-side').addEventListener('dragleave', e => {
  const zone = e.target.closest('.dv-drop');
  if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drop');
});
$('dv-side').addEventListener('drop', e => {
  const zone = e.target.closest('.dv-drop');
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove('drop');
  if (e.dataTransfer.files.length) sendFiles(last.devices.find(x => x.id === detailId), [...e.dataTransfer.files]);
});
</script>
</body>
</html>
