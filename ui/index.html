<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homebase</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310151c'/%3E%3Cpath d='M8 17l8-7 8 7v7H8z' fill='none' stroke='%2334d399' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --mono: "JetBrainsMono Nerd Font", "JetBrains Mono", "Source Code Pro", "Cascadia Mono", "DejaVu Sans Mono", monospace;
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #121820;
    --panel-2: #18202a;
    --line: #232d39;
    --text: #e6edf3;
    --muted: #8b98a7;
    --dim: #5b6876;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --violet: #a78bfa;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 13px/1.5 var(--mono);
    padding: 24px;
    min-height: 100vh;
  }
  header {
    display: grid; grid-template-columns: 1fr 25% 1fr; align-items: center;
    gap: 16px; margin: 0 auto 24px; max-width: 1320px;
  }
  header .clock { justify-self: end; }
  @media (max-width: 760px) {
    header { grid-template-columns: 1fr auto; }
    header .net { grid-column: 1 / -1; grid-row: 2; }
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 34px; height: 34px; }
  .brand h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .brand p { margin: 0; color: var(--muted); font-size: 12px; }
  .clock { text-align: right; }
  .clock .t { font-size: 26px; font-weight: 600; letter-spacing: .5px; }
  .clock .d { color: var(--muted); font-size: 12px; text-transform: capitalize; }

  main {
    max-width: 1320px; margin: 0 auto;
    display: grid; gap: 20px; align-items: start;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  #devices { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px;
  }
  .card h2 {
    margin: 0 0 14px; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .stack { display: grid; gap: 16px; align-content: start; }

  /* Device card */
  .device { position: relative; display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 18px; transition: border-color .15s, box-shadow .15s; }
  /* A file dragged over a card that can receive it. */
  .device.drop { border-color: var(--green); box-shadow: 0 0 0 3px rgba(52, 211, 153, .15); }
  .device:hover { border-color: #2c3846; }
  .device { cursor: pointer; }  /* a click opens the device's big screen */
  .dev-head { display: flex; align-items: flex-start; gap: 12px; }
  .dev-icon {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    background: var(--panel-2); flex: none;
  }
  .dev-icon svg { width: 22px; height: 22px; stroke: var(--text); }
  .dev-title { min-width: 0; flex: 1; }
  .dev-name { font-size: 16px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev-sub { color: var(--muted); font-size: 12px; }
  .dev-tools { display: flex; gap: 2px; margin: -4px -6px 0 0; opacity: .55; transition: opacity .15s; }
  .device:hover .dev-tools, .dev-tools:focus-within { opacity: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--panel-2); color: var(--muted); white-space: nowrap; margin-top: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .pill.on { color: var(--text); }
  .pill.on .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(52, 211, 153, .18); }
  .pill.off .dot { background: var(--red); }
  .device.is-off .dev-icon, .device.is-off .facts { opacity: .5; }

  .facts { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  .facts div { min-width: 0; }
  .facts span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  .facts b { font-size: 15px; font-weight: 600; white-space: nowrap; }
  /* Terminal-style loading bar while a device is still being checked. */
  .tbar { color: var(--green); font-weight: 400; letter-spacing: 0; }
  .tbar i { font-style: normal; color: var(--dim); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .device .actions button { padding: 9px 14px; font-size: 13px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px;
    padding: 11px 16px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    display: inline-flex; align-items: center; gap: 8px;
  }
  button:hover { border-color: #33404f; background: #1d2632; }
  button.primary { background: var(--green); color: #052e1f; border-color: transparent; }
  button.primary:hover { background: #4ade80; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button { transition: background .12s, border-color .12s, transform .08s; }
  button:active:not(:disabled) { transform: scale(.96); }
  /* While a click is being handled: spinner instead of the icon, no double clicks. */
  button.busy { pointer-events: none; }
  button.busy > svg { display: none; }
  button.busy::before { content: ''; width: 14px; height: 14px; flex: none; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  .icon-btn.busy::before, .tv-btn.busy::before { margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--green); border-right-color: transparent;
          animation: spin .7s linear infinite; flex: none; }
  button.primary:disabled { background: var(--panel-2); color: var(--muted); opacity: 1; }
  button svg { width: 16px; height: 16px; }

  /* Terminal (this laptop) */
  .gauges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .gauge { text-align: center; }
  .gauge svg { width: 100%; max-width: 120px; height: auto; display: block; margin: 0 auto; }
  .gauge .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .gauge .sub { color: var(--dim); font-size: 11px; min-height: 16px; white-space: nowrap; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: right; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }

  .spark { width: 100%; height: 56px; display: block; }
  /* The graph sits right above the buttons, so it lines up across cards whatever is above it. */
  .device .spark { height: 30px; margin-top: auto; }
  .device .spark + .actions { margin-top: 0; }
  .spark-wrap { display: grid; gap: 4px; }
  .spark-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .spark-head b { color: var(--text); font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(16px);
    display: flex; align-items: center; gap: 12px; max-width: min(460px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 18px 12px 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .ti { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .toast .ti svg { width: 16px; height: 16px; }
  .toast.ok .ti { background: rgba(52, 211, 153, .15); color: var(--green); }
  .toast.err .ti { background: rgba(248, 113, 113, .15); color: var(--red); }
  .toast.info .ti { background: rgba(96, 165, 250, .15); color: var(--blue); }

  .dlg-back { position: fixed; inset: 0; background: rgba(4, 7, 10, .66); display: grid; place-items: center;
              padding: 16px; z-index: 20; opacity: 0; transition: opacity .15s; }
  .dlg-back.show { opacity: 1; }
  .dlg { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
         padding: 22px; box-shadow: 0 20px 48px rgba(0, 0, 0, .5); transform: scale(.96); transition: transform .15s; }
  .dlg-back.show .dlg { transform: scale(1); }
  .dlg .di { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; }
  .dlg .di svg { width: 22px; height: 22px; stroke: currentColor; }
  .dlg .di.info { background: rgba(96, 165, 250, .14); color: var(--blue); }
  .dlg .di.danger { background: rgba(248, 113, 113, .14); color: var(--red); }
  .dlg h3 { margin: 0 0 6px; font-size: 17px; }
  .dlg p { margin: 0; color: var(--muted); }
  .dlg-field { display: block; margin-top: 14px; }
  .dlg-field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .dlg-field small { display: block; font-size: 11px; color: var(--dim); margin-top: 5px; }
  .dlg input { width: 100%; font: inherit; font-size: 16px; letter-spacing: .5px; color: var(--text);
               background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .dlg input:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  .dlg .err-msg { color: var(--red); font-size: 12px; margin-top: 6px; min-height: 16px; }
  .dlg .row-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  /* A secondary action on the left of the dialog's buttons (e.g. remove key access). */
  .dlg .row-btns .dlg-extra { margin-right: auto; white-space: nowrap; background: transparent; border-color: transparent; color: var(--red); font-weight: 500; padding-inline: 4px; }
  .dlg .row-btns .dlg-extra:hover { background: transparent; text-decoration: underline; }
  button.danger { background: var(--red); color: #3b0909; border-color: transparent; }
  button.danger:hover { background: #fca5a5; }
  .stale { color: var(--amber); font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .icon-btn { padding: 7px; border-radius: 8px; background: transparent; border-color: transparent; color: var(--muted); }
  .icon-btn:hover { color: var(--text); background: var(--panel-2); border-color: var(--line); }
  .dev-head .pill { margin-left: auto; }
  .dev-icon.sm { width: 40px; height: 40px; border-radius: 10px; }
  .dev-icon.sm svg { width: 22px; height: 22px; }
  .disc-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .disc { background: var(--panel-2); border-radius: 12px; padding: 10px 10px 10px 12px; min-width: 0; }
  .disc.open { grid-column: 1 / -1; padding: 12px 14px 14px; }
  .disc-row { display: flex; align-items: center; gap: 12px; }
  .disc .dev-icon.sm { background: var(--bg); }
  .disc-info { min-width: 0; flex: 1; }
  .disc-info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .disc-add { flex: none; padding: 7px 12px; font-size: 13px; background: transparent; }
  .disc-form { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .disc-form input {
    flex: 1 1 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; min-width: 0;
  }
  .disc-form input:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  .kinds { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; }
  .disc-form .kind { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); background: var(--bg); }
  .disc-form .kind.sel { background: rgba(52, 211, 153, .14); border-color: var(--green); color: var(--green); }
  .disc-btns { display: flex; gap: 8px; margin-left: auto; }
  .disc-btns button { padding: 8px 14px; font-size: 13px; }
  .disc-more { margin-top: 10px; background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; padding: 6px 4px; font-size: 13px; }
  .disc-more:hover { background: transparent; border-color: transparent; color: var(--text); }
  .disc-head { display: inline-flex; align-items: center; gap: 6px; }
  .muted-sm { color: var(--dim); font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  /* Internet in the middle of the top bar: just the line and the current ms, no box. */
  .net { min-width: 0; }
  .net-chart { width: 100%; height: 40px; display: block; cursor: crosshair; overflow: visible; }
  .ev { display: grid; grid-template-columns: 54px 10px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 7px 0; }
  .ev time { color: var(--dim); font-size: 12px; }
  .ev i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); align-self: center; }
  .ev.on i { background: var(--green); } .ev.off i { background: var(--red); } .ev.new i { background: var(--amber); }
  .ev-day { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 2px; }
  .ev-day:first-child { margin-top: 0; }
  .bat { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .bat-info { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bat-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bat-net { margin-left: auto; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .bat-net svg { width: 18px; height: 18px; flex: none; }
  .bat-net b { color: var(--text); font-weight: 600; }
  .bat-net.off b { color: var(--red); }
  .bat svg { width: 18px; height: 18px; flex: none; }
  .bat b { color: var(--text); font-weight: 600; }
  /* Command palette (press /). */
  .pal-back { position: fixed; inset: 0; z-index: 20; background: rgba(4, 7, 10, .6); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
  .pal-back[hidden] { display: none; }
  .pal { width: min(620px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .55); }
  .pal-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .pal-p { color: var(--green); white-space: nowrap; }
  .pal-in input { flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--text); background: transparent; border: 0; outline: none; caret-color: var(--green); }
  .pal-list { max-height: 50vh; overflow-y: auto; padding: 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .pal-item { display: flex; justify-content: space-between; gap: 16px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .pal-item b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pal-item span { color: var(--dim); white-space: nowrap; }
  .pal-item.sel { background: var(--panel-2); }
  .pal-item.sel b { color: var(--green); }
  .pal-empty { padding: 10px; color: var(--dim); }
  .pal-help { padding: 8px 16px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }

  /* A device's big screen: who it is up top, live numbers and charts on the left, commands on the right. */
  .dev-modal { position: fixed; inset: 0; background: rgba(4, 7, 10, .72); display: grid; place-items: center; padding: 24px; z-index: 9; }
  .dev-modal[hidden] { display: none; }
  .dev-win { width: min(1040px, 100%); max-height: min(820px, 100%); display: flex; flex-direction: column;
             background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .dv-head { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .dv-head .dev-icon { width: 44px; height: 44px; border-radius: 12px; }
  .dv-who { min-width: 0; flex: 1; }
  .dv-who h3 { margin: 0; font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dv-who h3 .pill { margin-top: 0; font-size: 12px; }
  .dv-who h3 .pill small { color: var(--muted); font-weight: 500; font-size: 12px; }
  .dv-who p { margin: 2px 0 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dv-tools { display: flex; gap: 2px; margin-left: auto; }
  .dv-body { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
             display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
  .dv-main, .dv-side { padding: 18px; display: grid; gap: 22px; align-content: start; min-width: 0; }
  .dv-side { border-left: 1px solid var(--line); background: #0d1218; }
  @media (max-width: 820px) { .dv-body { grid-template-columns: minmax(0, 1fr); } .dv-side { border-left: 0; border-top: 1px solid var(--line); } }
  .dv-sec h4 { margin: 0 0 10px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.3px;
               display: flex; justify-content: space-between; gap: 10px; }
  .dv-sec h4 span { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--dim); }
  .dv-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .dv-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 8px; min-width: 0; }
  .dv-tile > span { color: var(--muted); font-size: 11px; }
  .dv-tile b { display: block; font-size: 24px; font-weight: 700; line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dv-tile b small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .dv-tile svg { display: block; width: 100%; height: 26px; margin-top: 6px; }
  .dv-chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 6px; }
  .dv-chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
  .dv-sys { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; }
  .dv-kv span { display: block; color: var(--dim); font-size: 11px; }
  .dv-kv b { font-weight: 500; }
  .dv-kv .bar { height: 4px; margin-top: 6px; }
  .dv-log { display: grid; gap: 2px; }
  .dv-log div { display: grid; grid-template-columns: 56px 10px minmax(0, 1fr); gap: 8px; align-items: baseline; color: var(--muted); }
  .dv-log time { color: var(--dim); }
  .dv-log i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--dim); }
  .dv-log .on i { background: var(--green); }
  .dv-log .off i { background: var(--red); }
  .dv-cmds { display: grid; gap: 4px; }
  .dv-cmd { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
            background: transparent; border-color: transparent; padding: 9px 10px; font-weight: 500; border-radius: 9px; }
  .dv-cmd:hover, .dv-cmd:focus-visible { background: var(--panel-2); border-color: var(--line); }
  .dv-cmd .p { color: var(--green); }
  .dv-cmd code { font: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dv-cmd code em { font-style: normal; color: var(--muted); }
  .dv-cmd > span:last-child { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .dv-cmd.danger-item .p, .dv-cmd.danger-item code { color: var(--red); }
  .dv-drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
  .dv-drop b { display: block; color: var(--text); }
  .dv-drop small { color: var(--dim); }
  .dv-drop:hover, .dv-drop.drop { border-color: var(--green); background: rgba(52, 211, 153, .06); }
  .dv-speed { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
  .dv-speed .nums { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .dv-speed .nums div { display: grid; }
  .dv-speed .nums b { font-size: 20px; font-weight: 700; }
  .dv-speed .nums span { color: var(--dim); font-size: 11px; }
  .dv-speed button { justify-self: start; padding: 7px 12px; }
  .dv-note { color: var(--dim); font-size: 12px; margin: 0; }
  .dv-foot { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  .dv-foot kbd { font: inherit; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

  .term-modal { position: fixed; inset: 0; background: rgba(4, 7, 10, .72); display: grid; place-items: center; padding: 24px; z-index: 10; }
  .term-modal[hidden] { display: none; }
  .term-win { width: min(1100px, 100%); height: min(720px, 100%); display: flex; flex-direction: column;
              background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .term-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 16px;
              background: var(--panel); border-bottom: 1px solid var(--line); }
  .term-title { display: inline-flex; align-items: center; gap: 10px; }
  .term-title svg { width: 16px; height: 16px; color: var(--green); }
  .term-status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-left: 14px; }
  .term-status .dot { background: var(--green); }
  .term-status.ended .dot { background: var(--dim); }
  .term-loading { height: 100%; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--muted); }
  .term-loading .spin { width: 26px; height: 26px; border-width: 3px; }
  .term-actions { display: flex; gap: 8px; margin-left: auto; margin-right: 8px; }
  .term-actions button { padding: 6px 12px; font-size: 13px; }
  .term-body { flex: 1; min-height: 0; padding: 10px 6px 6px 12px; }
  .term-body .xterm { height: 100%; }
  /* Falling characters behind the terminal text; the terminal itself is transparent. */
  .term-win { position: relative; }
  .term-bar, .term-body { position: relative; z-index: 1; }
  .term-rain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .18; pointer-events: none; }
  /* xterm's viewport sits behind the text, is a few px taller than the last full row, and is
     #000 with a native scrollbar: that leftover strip showed as a black bar at the bottom. */
  .term-body .xterm .xterm-viewport { background-color: transparent; scrollbar-width: none; }
  .term-body .xterm .xterm-viewport::-webkit-scrollbar { display: none; }
  .minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 14px; }
  .mini > div { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 11px; color: var(--muted); }
  .mini b { color: var(--text); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mini > i { display: block; height: 3px; margin-top: 4px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
  .mini > i > i { display: block; height: 100%; border-radius: 99px; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
  .meter-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .meter-head b { color: var(--text); font-weight: 600; font-size: 14px; }
  .meter .bar { margin-top: 6px; }
  .meter-sub { color: var(--dim); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmd { display: flex; gap: 8px; align-items: stretch; margin-top: 14px; }
  .cmd code { flex: 1; min-width: 0; font: 13px/1.4 "JetBrains Mono", "DejaVu Sans Mono", monospace; color: var(--green);
              background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all; }
  .dlg ol { margin: 12px 0 0; padding-left: 20px; color: var(--muted); }
  .dlg ol li { margin: 4px 0; }
  .dlg ol b { color: var(--text); }
  .tv { display: grid; gap: 14px; }
  .tv-now { display: grid; gap: 4px; min-width: 0; }
  .tv-now b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-state { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .tv-state.on { color: var(--green); }
  .tv-prog { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .tv-prog .bar { margin: 0; }
  .tv-ctl { display: flex; justify-content: center; align-items: center; gap: 12px; }
  .tv-btn { width: 42px; height: 42px; padding: 0; justify-content: center; border-radius: 50%; }
  .tv-btn svg { width: 18px; height: 18px; }
  .tv-btn.big { width: 54px; height: 54px; background: var(--green); color: #052e1f; border-color: transparent; }
  .tv-btn.big:hover { background: #4ade80; }
  .tv-btn.big svg { width: 22px; height: 22px; }
  .tv-btn.is-muted { color: var(--red); }
  .tv-vol { display: grid; grid-template-columns: auto 1fr 34px; gap: 12px; align-items: center; }
  .tv-vol .tv-btn { width: 36px; height: 36px; }
  .tv-vol-n { text-align: right; font-weight: 600; }
  .tv-range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; outline: none; cursor: pointer;
              background: linear-gradient(to right, var(--green) var(--p), var(--panel-2) var(--p)); border: 1px solid var(--line); }
  .tv-range:disabled { opacity: .45; cursor: not-allowed; }
  .tv-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 3px solid var(--green); }
  .tv-range::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 3px solid var(--green); }
  .os-tag { color: var(--green); font-weight: 600; }
  .welcome { grid-column: 1 / -1; padding: 22px; }
  .welcome h3 { margin: 0 0 6px; font-size: 16px; }
  .welcome p { margin: 0; color: var(--muted); }
  .welcome b { color: var(--text); font-weight: 600; }
  footer { max-width: 1200px; margin: 18px auto 0; color: var(--dim); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#121820" stroke="#232d39"/><path d="M8 17l8-7 8 7v7H8z" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round"/></svg>
    <div>
      <h1>Homebase</h1>
      <p>Your home control panel</p>
    </div>
  </div>
  <div class="net" id="inet"></div>
  <div class="clock"><div class="t" id="clock">--:--</div><div class="d" id="date"></div></div>
</header>

<main>
  <div class="stack">
    <div id="devices"></div>
    <div id="discovered"></div>
  </div>

  <div class="stack">
    <section class="card">
      <h2>Terminal <span id="stale"></span></h2>
      <div class="gauges">
        <div class="gauge"><svg viewBox="0 0 120 80" id="g-cpu"></svg><div class="lbl">CPU</div><div class="sub" id="g-cpu-sub"></div></div>
        <div class="gauge"><svg viewBox="0 0 120 80" id="g-mem"></svg><div class="lbl">Memory</div><div class="sub" id="g-mem-sub"></div></div>
        <div class="gauge"><svg viewBox="0 0 120 80" id="g-temp"></svg><div class="lbl">Temperature</div><div class="sub" id="g-temp-sub"></div></div>
      </div>
      <div class="bat"><span class="bat-info" id="bat"></span><span class="bat-net" id="net-ms"></span></div>
    </section>

    <section class="card">
      <h2>What happened</h2>
      <div id="events"></div>
    </section>
  </div>
</main>

<footer>Updates every 2 seconds · runs locally on this computer · press / for commands</footer>
<div class="pal-back" id="pal" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="Commands">
    <label class="pal-in"><span class="pal-p">homebase:~$</span><input id="pal-input" autocomplete="off" spellcheck="false" placeholder="ssh, wake, send, speed…"></label>
    <div class="pal-list" id="pal-list" role="listbox"></div>
    <div class="pal-help">Tab completes · ↑↓ picks · Enter runs · Esc closes</div>
  </div>
</div>
<input type="file" id="send-file" multiple hidden>
<div class="dev-modal" id="dev-modal" hidden>
  <div class="dev-win" role="dialog" aria-modal="true" aria-labelledby="dv-name">
    <div class="dv-head">
      <div class="dev-icon" id="dv-icon"></div>
      <div class="dv-who" id="dv-who"></div>
      <span class="dv-tools">
        <button class="icon-btn" id="dv-edit" title="Settings"></button>
        <button class="icon-btn" id="dv-close" title="Close"></button>
      </span>
    </div>
    <div class="dv-body" id="dv-body">
      <div class="dv-main" id="dv-main"></div>
      <div class="dv-side" id="dv-side"></div>
    </div>
    <div class="dv-foot"><span><kbd>Esc</kbd> close</span><span><kbd>/</kbd> commands</span><span>updates every 2 s</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="term-modal" id="term-modal" hidden>
  <div class="term-win">
    <canvas class="term-rain" id="term-rain" aria-hidden="true"></canvas>
    <div class="term-bar">
      <span class="term-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"/></svg><b id="term-name"></b><span class="muted-sm" id="term-host"></span><span class="term-status" id="term-status"></span></span>
      <span class="term-actions" id="term-actions"></span>
      <button class="icon-btn" id="term-close" title="Close the terminal">✕</button>
    </div>
    <div class="term-body" id="term-body"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const ICONS = {
  desktop: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
  laptop: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M2 19h20"/></svg>',
  pi: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 22h8"/></svg>',
  router: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="13" width="20" height="7" rx="2"/><path d="M6 17h.01M10 17h.01M8 9a6 6 0 0 1 8 0M5 6a10 10 0 0 1 14 0"/></svg>',
  other: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>',
  connect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>',
};

function bytes(n, perSec) {
  if (n == null) return '–';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (n < 10 && i ? n.toFixed(1) : Math.round(n)) + ' ' + u[i] + (perSec ? '/s' : '');
}
function dur(s) {
  s = Math.floor(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m`;
}
function color(pct, warn = 70, crit = 90) {
  return pct >= crit ? 'var(--red)' : pct >= warn ? 'var(--amber)' : 'var(--green)';
}

function gauge(el, pct, text, col) {
  const r = 46, cx = 60, cy = 62, len = Math.PI * r;
  const p = Math.max(0, Math.min(100, pct || 0)) / 100;
  el.innerHTML = `
    <path d="M${cx - r} ${cy} A${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="#232d39" stroke-width="9" stroke-linecap="round"/>
    <path d="M${cx - r} ${cy} A${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${len}" stroke-dashoffset="${len * (1 - p)}" style="transition:stroke-dashoffset .6s"/>
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">${text}</text>`;
}

// Wi-Fi icon whose lit arcs follow signal strength (like the battery's fill); crossed out when offline.
function wifiIcon(signal, ok) {
  if (!ok) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.8" stroke-linecap="round"><path d="M4 9.5a12 12 0 0 1 16 0M7 13a7.5 7.5 0 0 1 10 0"/><circle cx="12" cy="17.5" r="1.3" fill="var(--red)" stroke="none"/><path d="M4 4l16 16"/></svg>';
  }
  const bars = signal == null ? 3 : signal > -60 ? 3 : signal > -70 ? 2 : 1;
  const arc = (d, on) => `<path d="${d}" stroke="${on ? 'currentColor' : 'var(--line)'}"/>`;
  return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">
    ${arc('M3.5 9.5a12.5 12.5 0 0 1 17 0', bars >= 3)}${arc('M6.5 12.8a8 8 0 0 1 11 0', bars >= 2)}${arc('M9.3 15.9a3.8 3.8 0 0 1 5.4 0', bars >= 1)}
    <circle cx="12" cy="18.8" r="1.3" fill="currentColor"/></svg>`;
}

function batteryIcon(b) {
  const w = Math.max(1, Math.round(12 * b.pct / 100));
  const col = b.pct <= 15 && b.status === 'Discharging' ? 'var(--red)' : 'currentColor';
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="7" width="17" height="10" rx="2.5"/><path d="M21.5 10.5v3" stroke-linecap="round"/><rect x="5" y="9.5" width="${w}" height="5" rx="1" fill="${col}" stroke="none"/>${b.status === 'Charging' ? '<path d="M11.5 8.5l-2 4h3l-2 3" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round"/>' : ''}</svg>`;
}

function spark(el, series, max) {
  const w = el.clientWidth || 300, h = el.clientHeight || 56;
  el.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let out = '';
  for (const { data, col } of series) {
    if (!data || data.length < 2) continue;
    const m = max ?? Math.max(1, ...series.flatMap(s => s.data || []));
    const step = w / (90 - 1), off = w - (data.length - 1) * step;
    const pts = data.map((v, i) => [off + i * step, h - 3 - ((v ?? 0) / m) * (h - 8)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    out += `<path d="${line} L${pts.at(-1)[0]} ${h} L${pts[0][0]} ${h}Z" fill="${col}" opacity=".12"/>`;
    out += `<path d="${line}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>`;
  }
  el.innerHTML = out;
}

// A block bouncing along a track, like a terminal progress bar: ▱▱▰▰▰▱▱▱▱
// The card renders frame 0; one timer animates every bar on the page, so the
// 2 s refresh (which compares HTML) never sees them change.
const TBAR_W = 9, TBAR_SEG = 3;
function tbarFrame(i) {
  const span = TBAR_W - TBAR_SEG, pos = Math.abs((i % (2 * span)) - span);
  return `<i>${'▱'.repeat(span - pos)}</i>${'▰'.repeat(TBAR_SEG)}<i>${'▱'.repeat(pos)}</i>`;
}
let tbarTick = 0;
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
  setInterval(() => {
    const bars = document.querySelectorAll('.tbar');
    if (!bars.length) return;
    const html = tbarFrame(++tbarTick);
    bars.forEach(b => { b.innerHTML = html; });
  }, 110);
}

function deviceCard(d, st, hist, now, stats, tv, ssh) {
  const online = st?.online;
  const checked = st != null && st.online != null;
  const pillCls = !checked ? '' : online ? 'on' : 'off';
  const pillTxt = !checked ? 'Checking…' : online ? 'On' : 'Off';
  const lat = online ? (st.latency != null ? `${st.latency} ms` : 'on the network') : '–';
  // The agent knows the real boot time; without it we only know when we first saw it on.
  const since = stats?.boot ? dur(now - stats.boot) : online && st.since ? dur(now - st.since) : '–';
  // The TV only takes commands for what it plays over DLNA, so the controls
  // only show up then; otherwise the card just shows its volume.
  const tvActive = tv && ['PLAYING', 'PAUSED_PLAYBACK'].includes(tv.state);
  const third = tv ? `<div><span>Volum</span><b>${tv.mute ? 'mut' : tv.volume}</b></div>` : '';
  const connectBtn = d.dlna
    ? (tv && !tvActive ? `<button class="primary" data-act="tvconnect">${ICONS.connect} Connect</button>` : '')
    // A Windows PC counts as prepared once its agent has reported (it then knows how Remote Desktop signs in).
    : d.windows && d.nla == null
    ? `<button class="primary" data-act="agent" ${online ? '' : 'disabled'}>${ICONS.connect} Prepare PC</button>`
    // Prepared and not Windows Home (-1): Connect stays the main button, even before the first Remote
    // Desktop check (it used to fall back to "Open terminal" then). Greyed out only when it surely won't work.
    : d.windows && d.nla !== -1
    ? `<button class="primary" data-act="connect" ${online && d.rdp !== false ? '' : 'disabled'}>${ICONS.connect} Connect</button>`
    : d.ssh
    ? `<button class="primary" data-act="terminal" ${online ? '' : 'disabled'}>${ICONS.terminal} Open terminal</button>`
    : '';
  // Waking only makes sense when it's off, so the button only shows then.
  const wakeBtn = d.has_wake && st?.online === false ? `<button data-act="wake">${ICONS.power} Wake it up</button>` : '';
  // Response time is mostly noise; it only earns a (quiet) line when the device is up.
  const latLine = online && d.probe_port && !tv;
  const latSpark = latLine ? `<svg class="spark" id="lat-${esc(d.id)}" preserveAspectRatio="none" aria-label="Response time, last 3 minutes"></svg>` : '';
  return `
  <section class="card device ${checked && !online ? 'is-off' : ''}" data-id="${esc(d.id)}">
    <div class="dev-head">
      <div class="dev-icon">${ICONS[d.kind] || ICONS.other}</div>
      <div class="dev-title">
        <div class="dev-name" title="${esc(d.name)}">${esc(d.name)}</div>
        <div class="dev-sub">${d.os ? `<span class="os-tag">${esc(d.os.replace(' (DLNA)', ''))}</span> · ` : ''}${esc(d.host)}</div>
        <span class="pill ${pillCls}"><span class="dot"></span>${pillTxt}</span>
      </div>
      <div class="dev-tools">
        <button class="icon-btn" data-act="edit" title="Settings">${ICONS.edit}</button>
        <button class="icon-btn" data-act="remove" title="Remove from the panel">${ICONS.x}</button>
      </div>
    </div>
    ${online ? `<div class="facts">
      ${st.latency != null ? `<div><span>Response</span><b>${Math.round(st.latency)} ms</b></div>` : ''}
      <div><span>On for</span><b>${since}</b></div>
      ${third}
    </div>` : !checked ? `<div class="facts">
      <div><span>Response</span><b class="tbar">${tbarFrame(0)}</b></div>
      <div><span>On for</span><b class="tbar">${tbarFrame(0)}</b></div>
      ${third}
    </div>${d.probe_port && !d.dlna ? '<svg class="spark"></svg>' : ''}` : ''}
    ${tvActive ? tvBlock(d, tv) : (stats || ssh) && online ? statsRow(stats || ssh) + latSpark : latLine ? latSpark : ''}
    ${connectBtn || wakeBtn ? `<div class="actions">${connectBtn}${wakeBtn}</div>` : ''}
  </section>`;
}

const TV_ICONS = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>',
  fwd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>',
  vol: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  muted: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>',
};

function clock(sec) {
  if (sec == null) return '–:––';
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = String(sec % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${s2}` : `${m}:${s2}`;
}

function tvBlock(d, tv) {
  const playing = tv.state === 'PLAYING', paused = tv.state === 'PAUSED_PLAYBACK';
  const loaded = playing || paused;
  const label = playing ? 'Playing' : paused ? 'Paused' : tv.state === 'STOPPED' ? 'Stopped' : 'Nothing playing';
  const pct = loaded && tv.dur ? Math.min(100, 100 * tv.pos / tv.dur) : 0;
  return `
    <div class="tv">
      <div class="tv-now">
        <span class="tv-state ${playing ? 'on' : ''}">${label}</span>
        <b>${loaded ? esc(tv.title || 'Untitled') : '<span class="muted-sm">Controls work only for what you send to the TV over DLNA, not for YouTube or the TV\'s other apps</span>'}</b>
      </div>
      ${loaded && tv.dur ? `<div class="tv-prog"><span>${clock(tv.pos)}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${clock(tv.dur)}</span></div>` : ''}
      <div class="tv-ctl">
        <button class="tv-btn" data-tv="seek" data-v="-10" title="Back 10 seconds" ${loaded ? '' : 'disabled'}>${TV_ICONS.back}</button>
        <button class="tv-btn big" data-tv="${playing ? 'pause' : 'play'}" title="${playing ? 'Pause' : 'Play'}" ${loaded || tv.state === 'STOPPED' ? '' : 'disabled'}>${playing ? TV_ICONS.pause : TV_ICONS.play}</button>
        <button class="tv-btn" data-tv="seek" data-v="10" title="Forward 10 seconds" ${loaded ? '' : 'disabled'}>${TV_ICONS.fwd}</button>
        <button class="tv-btn" data-tv="stop" title="Stop" ${loaded ? '' : 'disabled'}>${TV_ICONS.stop}</button>
      </div>
      <div class="tv-vol">
        <button class="tv-btn ${tv.mute ? 'is-muted' : ''}" data-tv="mute" title="${tv.mute ? 'Unmute' : 'Mute'}" ${loaded ? '' : 'disabled'}>${tv.mute ? TV_ICONS.muted : TV_ICONS.vol}</button>
        <input type="range" class="tv-range" min="0" max="100" value="${tv.volume}" style="--p:${tv.volume}%" ${loaded ? '' : 'disabled title="The TV only lets the volume change while playing over DLNA"'}>
        <b class="tv-vol-n">${tv.mute ? 'mut' : tv.volume}</b>
      </div>
    </div>`;
}

function meter(label, pct, detail, warn = 70, crit = 90, shown = null) {
  if (pct == null) return '';
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="meter"><div class="meter-head"><span>${label}</span><b>${shown ?? Math.round(p) + '%'}</b></div>
    <div class="bar"><i style="width:${p}%;background:${color(p, warn, crit)}"></i></div>
    <div class="meter-sub">${detail || '&nbsp;'}</div></div>`;
}

// Read over SSH from Linux devices (no agent installed there).
// One compact row of stats (read over SSH on Linux, sent by the agent on Windows):
// label, value and a thin bar each; the details are in the tooltip.
function statsRow(x) {
  const memUsed = x.mem_total - x.mem_free, diskUsed = x.disk_total - x.disk_free;
  const mini = (label, pct, shown, title, warn, crit) => {
    if (pct == null && shown == null) return '';
    const p = Math.max(0, Math.min(100, pct ?? 0));
    return `<div class="mini" title="${esc(title)}"><div><span>${label}</span><b>${shown ?? Math.round(p) + '%'}</b></div>
      <i><i style="width:${p}%;background:${color(p, warn, crit)}"></i></i></div>`;
  };
  return `<div class="minis">
      ${mini('CPU', x.cpu, x.cpu == null ? '…' : null, 'CPU', 70, 90)}
      ${mini('RAM', 100 * memUsed / x.mem_total, null, `Memory: ${bytes(memUsed)} of ${bytes(x.mem_total)}`, 75, 90)}
      ${x.temp != null ? mini('Temp', x.temp, `${Math.round(x.temp)}°`, 'CPU temperature', 65, 80) : ''}
      ${x.gpu != null ? mini('GPU', x.gpu, null, 'Graphics card', 70, 90) : ''}
      ${x.disk_total ? mini('Disk', 100 * diskUsed / x.disk_total, null, `Disk: ${bytes(x.disk_free)} free of ${bytes(x.disk_total)}`, 85, 95) : ''}
    </div>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// Type picked per discovered device; kept outside the DOM so the 2 s refresh doesn't reset it.
const chosenKind = {};
const kindOf = x => chosenKind[x.mac] || (KINDS.some(([k]) => k === x.kind) ? x.kind : 'other');

const KINDS = [['desktop', 'Desktop'], ['laptop', 'Laptop'], ['pi', 'Raspberry Pi'], ['tv', 'TV / media'], ['other', 'Other']];

// Windows reports names in capitals ("OFFICE", "DESKTOP-4F2K"); make the plain ones readable.
function prettyName(n) {
  if (!n) return '';
  return /^[A-Z][A-Z]+$/.test(n) ? n[0] + n.slice(1).toLowerCase() : n;
}

let discOpen = null;      // MAC of the row whose "add" form is open (one at a time)
let discShowUnknown = false;

function discRow(x) {
  const nice = prettyName(x.name || x.hostname);
  const title = nice || x.label || x.vendor || 'Unknown device';
  const sub = (x.label && nice ? `<span class="os-tag">${esc(x.label)}</span> · ` : '') + esc(x.ip);
  const open = discOpen === x.mac;
  const guess = nice || (x.kind === 'pi' ? 'Raspberry Pi' : x.kind === 'tv' ? 'TV' : '');
  return `
    <div class="disc ${open ? 'open' : ''}" data-ip="${esc(x.ip)}" data-mac="${esc(x.mac)}" title="${esc(x.mac)}">
      <div class="disc-row">
        <div class="dev-icon sm">${ICONS[x.kind] || ICONS.other}</div>
        <div class="disc-info"><b>${esc(title)}</b><div class="dev-sub">${sub}</div></div>
        ${open ? '' : `<button class="disc-add" data-act="open">${ICONS.plus} Add</button>`}
      </div>
      ${open ? `
      <div class="disc-form">
        <input type="text" placeholder="Name (e.g. Living room PC)" value="${esc(guess)}" maxlength="40">
        <div class="kinds">${KINDS.map(([k, l]) => `<button type="button" class="kind${k === kindOf(x) ? ' sel' : ''}" data-kind="${k}">${l}</button>`).join('')}</div>
        <div class="disc-btns">
          <button data-act="cancel">Cancel</button>
          <button class="primary" data-act="add">${ICONS.plus} Add to panel</button>
        </div>
      </div>` : ''}
    </div>`;
}

function discoveredCard(list, lastScan, now) {
  const ago = lastScan ? Math.max(0, Math.round((now - lastScan) / 60)) : null;
  const when = ago == null ? 'searching…' : ago < 1 ? 'just now' : `${ago} min ago`;
  list = list.filter(x => x.kind !== 'router');
  // Things we could put a name or an OS on come first; the anonymous rest waits behind a toggle.
  const known = list.filter(x => x.name || x.hostname || x.label);
  const unknown = list.filter(x => !(x.name || x.hostname || x.label));
  const showUnknown = discShowUnknown || unknown.some(x => x.mac === discOpen);
  const rows = known.map(discRow).join('') + (showUnknown ? unknown.map(discRow).join('') : '');
  const toggle = unknown.length
    ? `<button class="disc-more" data-act="unknown">${showUnknown ? 'Hide unknown devices'
        : `Show ${unknown.length} more unknown ${unknown.length === 1 ? 'device' : 'devices'}`}</button>` : '';
  return `
  <section class="card" id="disc-card">
    <h2>Found on the network <span class="disc-head"><span class="muted-sm">last search: ${when}</span>
      <button class="icon-btn" data-act="scan" title="Search again">${ICONS.refresh}</button></span></h2>
    ${rows ? `<div class="disc-list">${rows}</div>` : ''}
    ${toggle}
    ${list.length ? '' : '<div class="dev-sub">Nothing new on the network. Turn on a new device (a Raspberry Pi, say) and it shows up here within 30 seconds.</div>'}
  </section>`;
}

let last = null, lastOk = 0;
// Visual feedback for any click whose effect isn't instant: spinner on the button until done.
async function busy(btn, fn, minMs = 0) {
  const t0 = Date.now();
  btn?.classList.add('busy');
  try { return await fn(); }
  finally {
    const left = minMs - (Date.now() - t0);
    if (left > 0) await new Promise(r => setTimeout(r, left));
    btn?.classList.remove('busy');
  }
}

// True while a mouse button or finger is down on a card (a button, the TV volume slider...).
// Redrawing then would swap the pressed element for a new one between press and release,
// and the browser drops the click: buttons sometimes seemed to ignore clicks.
let pointerHeld = false;

// Fixed steps for the chart's ceiling, so the scale only jumps when it must (never per sample).
const NET_STEPS = [20, 50, 100, 200, 500, 1000, 2000];
let netHover = null;  // index of the sample under the mouse, or null

function renderInternet(s) {
  const n = s.internet;
  const ok = n?.online;
  const data = s.history?.net_lat || [];
  const box = $('inet');
  box.className = 'net ' + (n == null ? '' : ok ? 'on' : 'off');
  box.title = n == null ? 'Internet: checking' : ok
    ? `Internet${n.ssid ? ' · ' + n.ssid : ''}${n.since ? ' · stable for ' + dur(s.now - n.since) : ''} · last ${Math.round(data.length * 4 / 60)} min`
    : 'The internet is down';
  if (!box.querySelector('.net-chart')) {
    box.innerHTML = `<svg class="net-chart" preserveAspectRatio="none" role="img" aria-label="Response time to the internet"></svg>`;
    const svg = box.querySelector('.net-chart');
    svg.addEventListener('mousemove', e => {
      const d = last?.history?.net_lat || [];
      const r = svg.getBoundingClientRect();
      const right = r.width - NET_INSET, step = (right - NET_INSET) / (NET_POINTS - 1), off = right - (d.length - 1) * step;
      const i = Math.round((e.clientX - r.left - off) / step);
      netHover = i >= 0 && i < d.length && d[i] != null ? i : null;
      renderInternet(last);
    });
    svg.addEventListener('mouseleave', () => { netHover = null; renderInternet(last); });
  }
  // The current ms lives at the right of the battery row, in the Terminal card.
  const ms = $('net-ms');
  ms.className = 'bat-net' + (n && !ok ? ' off' : '');
  const icon = wifiIcon(s.netbook?.net?.signal, n == null || ok);
  ms.innerHTML = n == null ? `${icon}<span>Internet …</span>`
    : !ok ? `${icon}<span>Internet <b>down for ${dur(s.now - n.down_since)}</b></span>`
    : `${icon}<span>Internet <b>${n.latency != null ? Math.round(n.latency) + ' ms' : 'connected'}</b></span>`;
  drawNetChart(box.querySelector('.net-chart'), data, ok !== false);
}

const NET_POINTS = 90;
const NET_INSET = 7;  // keeps the 4px end dot (+2px ring) inside the drawing on every side

function drawNetChart(svg, data, ok) {
  const w = svg.clientWidth || 300, h = svg.clientHeight || 38;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  // Scale to the usual values (90th percentile), not the rare spike, so normal
  // variation stays readable; spikes just touch the top edge.
  const vals = data.filter(v => v != null).sort((a, b) => a - b);
  const typical = vals.length ? vals[Math.floor(vals.length * 0.9)] : 1;
  const top = NET_STEPS.find(x => x >= typical * 1.4) || NET_STEPS.at(-1);
  const pad = NET_INSET, right = w - NET_INSET;
  const step = (right - pad) / (NET_POINTS - 1), off = right - (data.length - 1) * step;
  const y = v => h - pad - Math.min(v, top) / top * (h - 2 * pad);
  const col = ok ? 'var(--green)' : 'var(--red)';
  let out = '';
  // Until the history fills up (after a restart or standby), the empty left part
  // is a faint dotted line at the first known level, so the chart always spans the bar.
  const firstIdx = data.findIndex(v => v != null);
  const startX = firstIdx < 0 ? right : off + firstIdx * step;
  if (startX - pad > 2) {
    const fy = firstIdx < 0 ? h / 2 : y(data[firstIdx]);
    out += `<line x1="${pad}" x2="${startX.toFixed(1)}" y1="${fy.toFixed(1)}" y2="${fy.toFixed(1)}" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round"/>`;
  }
  // Missed checks (null) break the line instead of being drawn as 0.
  let path = '', pen = false, lastPt = null;
  data.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    const pt = [off + i * step, y(v)];
    path += (pen ? 'L' : 'M') + pt[0].toFixed(1) + ' ' + pt[1].toFixed(1);
    pen = true; lastPt = pt;
  });
  if (path) {
    out += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  if (netHover != null && data[netHover] != null) {
    const hx = off + netHover * step;
    const tx = hx > w - 60 ? hx - 8 : hx + 8, anchor = hx > w - 60 ? 'end' : 'start';
    out += `<text x="${tx}" y="11" text-anchor="${anchor}" fill="var(--text)" font-size="11" font-weight="600">${Math.round(data[netHover])} ms</text>
      <line x1="${hx}" x2="${hx}" y1="0" y2="${h}" stroke="var(--muted)" stroke-width="1"/>
      <circle cx="${hx}" cy="${y(data[netHover])}" r="4" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`;
  } else if (lastPt) {
    out += `<circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="4" fill="${col}" stroke="var(--bg)" stroke-width="2"/>`;
  }
  svg.innerHTML = out;
}

function renderEvents(list) {
  if (!list.length) { $('events').innerHTML = '<div class="dev-sub">Nothing yet. Devices turning on and off, internet outages and new devices show up here.</div>'; return; }
  const today = new Date().toDateString(), yest = new Date(Date.now() - 864e5).toDateString();
  let day = null, html = '';
  for (const e of list) {
    const d = new Date(e.t * 1000), ds = d.toDateString();
    if (ds !== day) {
      day = ds;
      html += `<div class="ev-day">${ds === today ? 'Today' : ds === yest ? 'Yesterday' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })}</div>`;
    }
    html += `<div class="ev ${esc(e.kind)}"><time>${d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</time><i></i><span>${esc(e.text)}</span></div>`;
  }
  if ($('events').dataset.html !== html) { $('events').innerHTML = html; $('events').dataset.html = html; }
}

let termPreloaded = false;

function render(s) {
  // Load the terminal in the background once there's something to SSH into, so the first click is instant.
  if (!termPreloaded && s.devices?.some(d => d.ssh)) {
    termPreloaded = true;
    setTimeout(() => loadTerminalLib().catch(() => {}), 3000);
  }
  const nb = s.netbook || {};
  const h = s.history || {};

  // Devices
  // On devices first, then the ones still being checked, then the off ones; the list order otherwise stays.
  const rank = d => ({ true: 0, false: 2 })[s.status[d.id]?.online] ?? 1;
  const sorted = s.devices.map((d, i) => [d, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(([d]) => d);
  const html = sorted.map(d => deviceCard(d, s.status[d.id], h['lat:' + d.id], s.now, s.stats?.[d.id], s.tv?.[d.id], s.sshstats?.[d.id])).join('');
  const box = $('devices');
  const empty = `<section class="card welcome"><h3>Welcome to Homebase</h3>
    <p>Your devices show up here. Pick them from <b>Found on the network</b> below and press <b>Add</b>.</p></section>`;
  const out = html || empty;
  if (box.dataset.html !== out && !pointerHeld && !box.querySelector('.busy, .drop')) { box.innerHTML = out; box.dataset.html = out; }

  // Discovered devices: don't redraw while the user is typing a name.
  const disc = $('discovered');
  const dhtml = discoveredCard(s.discovered || [], s.last_scan, s.now);
  if (disc.dataset.html !== dhtml && !disc.contains(document.activeElement) && !disc.querySelector('.busy')) { disc.innerHTML = dhtml; disc.dataset.html = dhtml; }
  for (const d of s.devices) {
    const ce = $('cpu-' + d.id);
    if (ce) spark(ce, [{ data: h['cpu:' + d.id], col: 'var(--green)' }], 100);
    const el = $('lat-' + d.id);
    if (el) spark(el, [{ data: h['lat:' + d.id], col: 'var(--dim)' }]);
  }

  renderDetail(s);
  renderInternet(s);
  renderEvents((s.events || []).slice(0, 6));

  if (!nb.mem) return;

  gauge($('g-cpu'), nb.cpu, Math.round(nb.cpu) + '%', color(nb.cpu));
  gauge($('g-mem'), nb.mem.pct, Math.round(nb.mem.pct) + '%', color(nb.mem.pct, 75, 90));
  // "2.1 / 3.6 GB": short enough for one line under the gauge in a monospace font.
  const [mu, mt] = [bytes(nb.mem.used), bytes(nb.mem.total)];
  $('g-mem-sub').textContent = mu.split(' ')[1] === mt.split(' ')[1] ? `${mu.split(' ')[0]} / ${mt}` : `${mu} / ${mt}`;
  const t = nb.temps.cpu;
  gauge($('g-temp'), t ? (t - 30) / 70 * 100 : 0, t ? Math.round(t) + '°' : '–', t ? color(t, 70, 85) : 'var(--dim)');

  const b = nb.battery;
  $('bat').innerHTML = b ? `${batteryIcon(b)}<span>Battery <b>${b.pct}%</b> · ${{ Charging: 'charging', Discharging: 'on battery', Full: 'full', 'Not charging': 'plugged in' }[b.status] || esc(b.status)}</span>` : '';
}

async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    last = await r.json();
    lastOk = Date.now();
    render(last);
    $('stale').textContent = '';
  } catch {
    if (Date.now() - lastOk > 6000) $('stale').innerHTML = '<span class="stale">no connection to the server</span>';
  }
}

let timer;
function start() { clearInterval(timer); poll(); timer = setInterval(poll, 2000); }
document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : start());
addEventListener('resize', () => last && render(last));
start();

function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  $('date').textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
}
tick(); setInterval(tick, 10000);

// --- Built-in terminal (xterm.js, loaded only the first time it's needed) ---
let termDev = null, termMode = 'shell';
// What the terminal window says it's doing, per mode.
const TERM_MODES = {
  shell: null,
  update: 'Updating the system (sudo apt update && full-upgrade)…',
  reboot: 'Restarting the device…',
  poweroff: 'Shutting the device down…',
};
let term = null, termSid = null, termES = null, termFit = null, termEnded = false, termTail = '';
let termPending = '', termSending = false;

function loadScript(src) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

async function termPost(op, body) {
  return fetch(`/api/term/${termSid}/${op}`, { method: 'POST', body });
}

// Keystrokes must arrive in order, so send them one request at a time.
async function termSend(data) {
  termPending += data;
  if (termSending) return;
  termSending = true;
  while (termPending && termSid) {
    const chunk = termPending; termPending = '';
    try { await termPost('input', chunk); } catch { break; }
  }
  termSending = false;
}

let termLib = null;
function loadTerminalLib() {
  if (window.Terminal) return Promise.resolve();
  if (!termLib) {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = '/vendor/xterm.css';
    document.head.appendChild(css);
    termLib = loadScript('/vendor/xterm.js').then(() => loadScript('/vendor/addon-fit.js'))
      .catch(e => { termLib = null; throw e; });
  }
  return termLib;
}

// Little status next to the device name in the terminal bar.
function termStatus(text, working, ended = false) {
  $('term-status').className = 'term-status' + (ended ? ' ended' : '');
  $('term-status').innerHTML = text ? `${working ? '<span class="spin" style="width:12px;height:12px"></span>' : '<span class="dot"></span>'}${esc(text)}` : '';
}

async function openTerminal(dev, mode = 'shell') {
  if (!dev) return;
  termMode = mode;
  // Nothing is assumed about the login: the first time, ask which user to sign in as.
  if (!dev.ssh_user) {
    const user = await dialog({
      title: `Which user do you sign in to ${dev.name} as?`, icon: 'terminal', ok: 'Connect',
      text: 'The one picked when the system was installed (in Raspberry Pi Imager: "username"). It\'s remembered; change it with ✎.',
      input: { placeholder: 'e.g. pi, admin, ubuntu', validate: v => v ? USER_OK(v) : 'Type a user name' },
    });
    if (!user || !await saveDevice(dev.id, { ssh_user: user })) return;
    dev = last.devices.find(x => x.id === dev.id) || { ...dev, ssh_user: user };
  }
  termDev = dev;
  // Show the window right away; loading xterm.js takes a moment on a slow CPU.
  closeTerminal();
  $('term-name').textContent = dev.name;
  $('term-host').textContent = `${dev.ssh_user ? dev.ssh_user + '@' : ''}${dev.host}`;
  termStatus('Connecting…', true);
  $('term-body').innerHTML = '<div class="term-loading"><span class="spin"></span>Getting the terminal ready…</div>';
  $('term-modal').hidden = false;
  startRain();
  try { await loadTerminalLib(); }
  catch { closeTerminal(); toast('Couldn\'t load the terminal', 'err'); return; }
  $('term-body').innerHTML = '';

  term = new Terminal({
    fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--mono'),
    fontSize: 14, cursorBlink: true, scrollback: 3000, allowTransparency: true,
    theme: { background: 'rgba(0, 0, 0, 0)', foreground: '#e6edf3', cursor: '#34d399', cursorAccent: '#0b0f14',
             selectionBackground: '#264f78', black: '#1b2430', brightBlack: '#5b6876',
             green: '#34d399', brightGreen: '#6ee7b7', red: '#f87171', yellow: '#fbbf24', blue: '#60a5fa', magenta: '#a78bfa' },
  });
  termFit = new FitAddon.FitAddon();
  term.loadAddon(termFit);
  term.open($('term-body'));
  termFit.fit();
  term.focus();
  term.writeln(`\x1b[90mConnecting to ${dev.name}…\x1b[0m`);
  if (TERM_MODES[mode]) term.writeln(`\x1b[32m${TERM_MODES[mode]}\x1b[0m`);
  termEnded = false; termTail = '';

  let r;
  try { r = await (await fetch(`/api/term/start/${encodeURIComponent(dev.id)}`, { method: 'POST', body: JSON.stringify({ mode }) })).json(); } catch {}
  if (!r?.ok) { term.writeln('\x1b[31mNu s-a putut porni conexiunea.\x1b[0m'); termStatus('Eroare', false, true); return; }
  termSid = r.sid;
  termPost('resize', JSON.stringify({ cols: term.cols, rows: term.rows }));
  term.onResize(({ cols, rows }) => termSid && termPost('resize', JSON.stringify({ cols, rows })));
  term.onData(d => {
    if (termEnded) return closeTerminal();
    termSend(d);
  });

  const dec = new TextDecoder();
  termES = new EventSource(`/api/term/${termSid}/stream`);
  termES.onmessage = e => {
    if (!termEnded) termStatus('Conectat', false);
    const bytes = Uint8Array.from(atob(e.data), c => c.charCodeAt(0));
    term.write(bytes);
    termTail = (termTail + dec.decode(bytes, { stream: true })).slice(-400);
  };
  termES.addEventListener('exit', () => {
    termES.close();
    termEnded = true;
    termStatus('Deconectat', false, true);
    // Explain what went wrong in plain words, with a button that fixes it where possible.
    const say = (msg, ...btns) => {
      term.writeln('\r\n\x1b[33m' + msg + '\x1b[0m');
      $('term-actions').innerHTML = btns.map(([act, label]) => `<button data-term="${act}">${label}</button>`).join('');
    };
    if (/REMOTE HOST IDENTIFICATION HAS CHANGED|Host key verification failed/.test(termTail)) {
      say('The device has a different key than last time. Normal if you reinstalled it; otherwise, be careful.',
          ['newkey', 'Accept the new key'], ['retry', 'Retry']);
    } else if (/Permission denied|Too many authentication failures/.test(termTail)) {
      say(`Wrong user or password (user: ${termDev.ssh_user}).`, ['user', 'Change user'], ['retry', 'Retry']);
    } else if (/Connection refused|Connection reset|Connection closed by/.test(termTail)) {
      say('SSH isn\'t answering yet. If you just turned it on, wait 1–2 minutes (a Pi Zero can take ~5 min on its first boot). ' +
          'If it still fails, SSH is off: turn it on in Raspberry Pi Imager or with sudo raspi-config.', ['retry', 'Retry']);
    } else if (/timed out|No route to host|Could not resolve/.test(termTail)) {
      say('The device isn\'t answering. Check that it\'s on and connected to the network.', ['retry', 'Retry']);
    } else if (termMode === 'shell') {
      $('term-actions').innerHTML = '<button data-term="retry">Reconnect</button>';
    }
    term.writeln('\r\n\x1b[90m[Connection closed · press any key to close]\x1b[0m');
  });
  // The server never resends from the middle, so don't let EventSource auto-reconnect.
  termES.onerror = () => { if (termES.readyState !== EventSource.CLOSED) termES.close(); };
}

function closeTerminal() {
  if (termSid && !termEnded) termPost('close').catch(() => {});
  termES?.close();
  term?.dispose();
  term = termES = termFit = termSid = null;
  $('term-actions').innerHTML = '';
  termStatus('');
  termPending = '';
  $('term-modal').hidden = true;
  stopRain();
}

// Matrix-style rain behind the terminal. This laptop draws everything in software,
// so it stays cheap: ~12 fps, one fading wipe per frame, about a third of the columns active.
const RAIN_CHARS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
const RAIN_SIZE = 14;
let rain = null;

function startRain() {
  if (rain || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('term-rain'), ctx = cv.getContext('2d');
  const font = `${RAIN_SIZE}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`;
  let drops = [];  // per column: row of the falling head, or null while the column rests
  const step = () => {
    // Fade what's there instead of clearing, which leaves the trails.
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, .16)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#34d399';
    drops.forEach((row, i) => {
      if (row == null) { if (Math.random() < .006) drops[i] = 0; return; }
      ctx.fillText(RAIN_CHARS[Math.random() * RAIN_CHARS.length | 0], i * RAIN_SIZE, row * RAIN_SIZE);
      drops[i] = row * RAIN_SIZE > cv.height ? null : row + 1;
    });
  };
  const resize = () => {
    // 1:1 pixels even on HiDPI: it's a faint background, and fewer pixels is cheaper.
    cv.width = cv.clientWidth; cv.height = cv.clientHeight;
    ctx.font = font; ctx.textBaseline = 'top';
    drops = Array.from({ length: Math.ceil(cv.width / RAIN_SIZE) },
      () => Math.random() < .35 ? Math.random() * cv.height / RAIN_SIZE | 0 : null);
    for (let i = 0; i < 25; i++) step();  // open already flowing, not on an empty screen
  };
  const ro = new ResizeObserver(resize);
  ro.observe(cv);
  rain = { ro, timer: setInterval(() => { if (!document.hidden) step(); }, 80) };
}

function stopRain() {
  if (!rain) return;
  clearInterval(rain.timer);
  rain.ro.disconnect();
  rain = null;
}
