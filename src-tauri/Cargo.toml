[package]
name = "homebase"
version = "0.1.0"
description = "Homebase: panoul de control al terminalului"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Small binary, quick-ish builds on a 2-core Celeron.
[profile.release]
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 16
